# Extrinsic calibration: static rigid transforms from the rig reference
# frame to each sensor's optical/measurement frame.
#
# Edit the numbers below and relaunch to change them -- they are read at
# startup by scripts/calibration_publisher.py, which publishes them as
# tf2 static transforms and uses the lidar->camera entries to project
# lidar points into the camera images in scripts/sensor_fusion_node.py.
#
# translation is in meters, rotation_rpy is roll/pitch/yaw in radians,
# both expressed as "reference_frame -> child_frame" (matches tf2's
# static_transform convention: this is the pose of child_frame as seen
# from reference_frame).
#
# --- REAL HARDWARE ---
# Unlike the Gazebo rig (one enclosure, all sensors co-located), the
# physical setup is three separate devices -- Livox Avia, RPi camera,
# USB thermal module -- mounted wherever they physically sit. Leaving
# these at zero (as shipped) means the fusion node treats all three as
# co-located, which is wrong by however far apart they actually are:
# expect systematic misalignment between lidar geometry and camera color
# proportional to that real offset (a lidar point a few meters out will
# be off by roughly (offset / range) in the image).
#
# Measure the real x/y/z offset (meters) of each sensor's optical center
# from one reference point (e.g. the lidar) with a tape measure/calipers,
# in the rig's x-forward/y-left/z-up convention, and fill them in below.
# Small rotational misalignment (rotation_rpy) matters more than
# translation at range -- if you can, mount all three pointing the same
# direction and note any residual tilt.
reference_frame: camera_platform/camera_link
transforms:
  camera_platform/rgb_optical_frame:
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation_rpy: {roll: 0.0, pitch: 0.0, yaw: 0.0}
  camera_platform/thermal_optical_frame:
    # Solved from a live person-as-target capture (sat ~2.1m out,
    # centered) in calib_solve.py: matched the lidar body cluster's
    # projected centroid + spread against the thermal camera's own
    # detected heat-blob centroid + spread (scripts/calib_*.py,
    # /tmp scratchpad captures). y came out ~0 (no real lateral offset
    # within the fit's noise); z is a real, physically plausible small
    # vertical mounting offset.
    translation: {x: 0.0, y: -0.003, z: 0.061}
    rotation_rpy: {roll: 0.0, pitch: 0.0, yaw: 0.0}
  camera_platform/lidar_frame:
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation_rpy: {roll: 0.0, pitch: 0.0, yaw: 0.0}
